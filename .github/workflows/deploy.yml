name: Render and Deploy Bookdown Site

# This triggers the action whenever you push to your main/master branch
on:
  push:
    branches:
      - main # Change to 'master' if that is your default branch name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # Grant permissions needed for the GITHUB_TOKEN to push to a branch
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup R Environment
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R Dependencies
        # I've included the packages your Rmd script explicitly calls for
        run: |
          install.packages(c("rmarkdown", "bookdown", "knitr", "readr"))
        shell: Rscript {0}

      - name: Render Rmd to HTML
        # If your file is named something other than index.Rmd, change it here.
        # If you are compiling a multi-file bookdown project, use bookdown::render_book("index.Rmd")
        run: |
          rmarkdown::render("index.Rmd") 
        shell: Rscript {0}

      - name: Deploy to 'website' branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: website
          # IMPORTANT: Change this if your HTML outputs to a specific folder (like _book or _site)
          publish_dir: ./_book
